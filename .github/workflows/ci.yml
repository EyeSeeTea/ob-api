name: CI

on:
    push:
        branches: [master, development]
    pull_request:

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
            - run: corepack enable
            - run: yarn install --immutable
            - run: yarn check
